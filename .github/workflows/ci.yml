name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib scipy hitran-api

    - name: Syntax check
      run: |
        python -m py_compile tdlas_sim.py
        python -m py_compile tools/tdlas_mcp.py
        python -m py_compile tools/tdlas_hitran.py
        python -m py_compile tools/remote_link.py
